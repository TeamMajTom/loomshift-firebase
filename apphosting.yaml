# Firebase App Hosting configuration for this app's backend.
#
# Kept small on purpose: the instance cap bounds what a traffic spike, or a
# runaway loop, can cost on a pay-as-you-go plan. Raise it when you need to.
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBk3lBdXZM6VhLad8l17ehTHuSx7Fcn6Ww
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: loomshift-spike.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: loomshift-spike
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:539500848318:web:729949740e9d0fab4faaef
    availability:
      - BUILD
      - RUNTIME
